[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mace-torch-v1"
dynamic = ["version"]
description = "The PyTorch stack for MACE v1: models, training, kernel backends, deployment."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MACE developers" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
# torch enters here and nowhere else. `mace-core` stays framework-free, which
# is what lets the same contract serve the jax implementation; this package is
# the torch binding of it, so the dependency belongs at this level and is the
# whole point of the package existing separately.
#
# The floor is the repository's, 2.5, the first release with wheels for every
# supported Python. The kernel dispatch needs 2.4 or later on its own:
# `torch.library.custom_op` and its `register_fake` / `register_autograd`
# arrived there, and earlier releases have only the `autograd.Function` route,
# which `torch.compile(fullgraph=True)` cannot see through without a graph break.
dependencies = [
    "mace-core",
    "torch>=2.5",
    # This package's default neighbour-list backend, registered below. The
    # floor is the release whose per-axis periodicity and squared-length cutoff
    # the conformance cases were run against.
    "vesin>=0.6.2",
    # Covalent radii for the ZBL repulsion and the distance transforms.
    "ase",
    # The checkpoint format. Tensors only, no pickle, so a checkpoint carries
    # no executable code and can be read without trusting its author.
    "safetensors",
    # The reference electrostatics solver computes its Gaussian overlap
    # integrals and normalisations with it when it is built.
    "scipy",
    # Training curves and the standalone plot command. Imported only when used.
    "matplotlib>=3.6",
]

[project.entry-points."mace.neighbor_backends"]
# A framework-free provider: it returns numpy, but importing vesin also imports
# torch whenever torch is installed, so it is registered from here.
vesin = "mace_torch.neighbors.vesin_backend:VesinBackend"

[project.optional-dependencies]
# Use the solver revision recorded by the LES goldens and requirements/les.txt.
les = ["les @ git+https://github.com/ChengUCB/les.git@fadfb0ca3b89ed371e5de6b383f4425defabd4a8"]
fpsample = ["fpsample"]
schedulefree = ["schedulefree"]
# Reporting a run to Weights and Biases. Optional in the sense that matters:
# the import happens inside the tracker's constructor, so a run with tracking
# off never touches the package.
wandb = ["wandb"]
# The cuEquivariance kernel backend. The pins are the legacy distribution's,
# for its reasons: the ops major has to match torch.version.cuda, and the ops
# wheels stop below 0.11, whose binaries fail to import and leave
# cuequivariance running its pure-torch path.
cueq = ["cuequivariance-torch>=0.2.0,<0.12"]
cueq-cuda-12 = ["cuequivariance-ops-torch-cu12>=0.2.0,<0.11"]
cueq-cuda-13 = ["cuequivariance-ops-torch-cu13>=0.7.0,<0.11"]
# The OpenEquivariance backend, which compiles its kernels on first use and
# needs a CUDA toolkit and a C++20 host compiler for that.
oeq = ["openequivariance"]

[project.entry-points."mace.kernel_backends.torch"]
# The mandatory reference backend, discovered the same way any third-party one
# is: through an entry point, with nothing in `mace_core` naming it.
reference = "mace_torch.backends.reference:ReferenceBackend"
# Registered whether or not cuequivariance is installed: without it the import
# fails, discovery records why, and asking for it by name says so.
cueq = "mace_torch.backends.cueq:CuEqBackend"
oeq = "mace_torch.backends.oeq:OeqBackend"

[project.entry-points."mace.electrostatics_backends.torch"]
# The reference long-range solver, in the tree and found the way any other
# solver is, in a group of its own beside the kernel backends'.
reference = "mace_torch.electrostatics.solver:ReferenceSolver"

[project.entry-points."mace.commands"]
# The mace subcommands this package implements, named by their words with dots
# between them. mace_core.cli finds them here and names no package itself.
train = "mace_torch.cli.commands:TRAIN"
"model.export-config" = "mace_torch.cli.commands:EXPORT_CONFIG"
eval = "mace_torch.cli.commands:EVAL"
"model.select-head" = "mace_torch.cli.commands:SELECT_HEAD"
"model.convert" = "mace_torch.cli.commands:CONVERT"
"model.convert-device" = "mace_torch.cli.commands:CONVERT_DEVICE"
"data.select" = "mace_torch.cli.commands:SELECT_DATA"
"data.prepare" = "mace_torch.cli.commands:PREPARE"
"data.pseudolabel" = "mace_torch.cli.commands:PSEUDOLABEL"
"plot.training" = "mace_torch.cli.commands:PLOT"
"md.active-learning" = "mace_torch.cli.commands:MD"
"export.lammps" = "mace_torch.cli.commands:EXPORT_LAMMPS"
"export.full-basis-weights" = "mace_torch.cli.commands:EXPORT_FULL_BASIS"
"model.migrate" = "mace_torch.cli.commands:MIGRATE"

[project.urls]
Homepage = "https://github.com/ACEsuit/mace"

# No [project.scripts]. Every mace_* console entry point is owned by one
# distribution, mace-launcher; two distributions declaring the same script name
# is undefined behaviour in pip.

[tool.hatch.metadata]
# LES is distributed from its Git repository.
allow-direct-references = true

[tool.hatch.version]
source = "vcs"
# Tag prefixes are keyed on the directory, not the distribution name, so each
# package versions independently and renaming a distribution leaves the tag
# scheme alone. --match stops git describe resolving a sibling's tag or a
# legacy v0.3.x one, which tag-pattern would then reject outright.
tag-pattern = "^mace-torch-v(?P<version>.+)$"
fallback-version = "0.0.0"
raw-options = { root = "../..", git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "mace-torch-v*"] }

[tool.hatch.build.targets.wheel]
packages = ["src/mace_torch"]


[tool.hatch.build.targets.wheel.force-include]
"lammps/CMakeLists.txt" = "mace_torch/deploy/lammps/CMakeLists.txt"
"lammps/pair_mace_native.cpp" = "mace_torch/deploy/lammps/pair_mace_native.cpp"
"lammps/cueq_ops.cpp" = "mace_torch/deploy/lammps/cueq_ops.cpp"
"lammps/cueq_schemas.py" = "mace_torch/deploy/lammps/cueq_schemas.py"
