name: PLF547 POLAR correction audit
run-name: PLF547 POLAR ${{ inputs.phase }} on bluesky
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Smoke validation or full 129-case paired correction
        required: true
        type: choice
        default: smoke
        options: [smoke, full, followup, orb, water, uma-access]
permissions:
  contents: read
concurrency:
  group: plf547-polar-audit-bluesky
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, gpu]
    environment: gpu-internal
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      AUDIT_PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Hardware and isolated directory
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          free -h
          audit_dir="${RUNNER_TEMP}/plf547-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$audit_dir/results" "$audit_dir/checkpoints"
          cp -R benchmarks/plf547_polar_audit "$audit_dir/audit"
          mkdir "$audit_dir/audit/runtime" "$audit_dir/audit/inputs"
          tar -xzf "$audit_dir/audit/runtime-source.tar.gz" -C "$audit_dir/audit/runtime"
          tar -xzf "$audit_dir/audit/inputs.tar.gz" -C "$audit_dir/audit/inputs"
          echo "AUDIT_DIR=$audit_dir" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned evaluation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$AUDIT_DIR/venv"
          "$AUDIT_DIR/venv/bin/python" -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cu124
          "$AUDIT_DIR/venv/bin/python" -m pip install --disable-pip-version-check mace-torch==0.3.16 numpy==2.3.5 scipy==1.15.3 ase==3.26.0 e3nn==0.4.4 h5py==3.13.0 matscipy==1.2.0 torchmetrics==1.7.0 opt_einsum==3.4.0
          "$AUDIT_DIR/venv/bin/python" -m pip freeze > "$AUDIT_DIR/results/environment.txt"
      - name: Evaluate sequentially with controls before every model
        if: inputs.phase == 'smoke' || inputs.phase == 'full'
        shell: bash
        run: |
          set -euo pipefail
          cd "$AUDIT_DIR"
          for size in m l; do
            upper=$(echo "$size" | tr '[:lower:]' '[:upper:]')
            curl --fail --location --retry 3 --max-time 300 \
              "https://github.com/ACEsuit/mace-foundations/releases/download/mace_polar_1/MACE-POLAR-1-${upper}.model" \
              -o "checkpoints/${size}.model"
            timeout --signal=TERM --kill-after=30s 2700 \
              venv/bin/python audit/run_gpu.py --size "$size" --phase "$AUDIT_PHASE" \
              --checkpoint "checkpoints/${size}.model" --output "results/${AUDIT_PHASE}_${size}.json" \
              2>&1 | tee "results/${AUDIT_PHASE}_${size}.log"
          done
      - name: QUID and PLA15 fresh evaluations
        if: inputs.phase == 'followup' || inputs.phase == 'water'
        shell: bash
        run: |
          set -euo pipefail
          cd "$AUDIT_DIR"
          for size in m l omol; do
            if [ "$size" = omol ]; then
              url=https://github.com/ACEsuit/mace-foundations/releases/download/mace_omol_0/MACE-omol-0-extra-large-1024.model
            else
              upper=$(echo "$size" | tr '[:lower:]' '[:upper:]')
              url="https://github.com/ACEsuit/mace-foundations/releases/download/mace_polar_1/MACE-POLAR-1-${upper}.model"
            fi
            curl --fail --location --retry 3 --max-time 300 "$url" -o "checkpoints/${size}.model"
            timeout --signal=TERM --kill-after=30s 1800 \
              venv/bin/python "audit/run_${AUDIT_PHASE}.py" --model "$size" \
              --checkpoint "checkpoints/${size}.model" --output "results/${AUDIT_PHASE}_${size}.json" \
              2>&1 | tee "results/${AUDIT_PHASE}_${size}.log"
          done
      - name: ORB PLF547 corrected evaluation
        if: inputs.phase == 'orb'
        shell: bash
        run: |
          set -euo pipefail
          cd "$AUDIT_DIR"
          venv/bin/python -m pip install --disable-pip-version-check orb-models==0.5.5 torch==2.6.0 numpy==2.3.5 scipy==1.15.3 ase==3.26.0
          venv/bin/python -m pip freeze > results/environment.txt
          curl --fail --location --retry 3 --max-time 300 \
            https://orbitalmaterials-public-models.s3.us-west-1.amazonaws.com/forcefields/orb-v3-conservative-omol-20250820.ckpt \
            -o checkpoints/orb.ckpt
          timeout --signal=TERM --kill-after=30s 2700 \
            venv/bin/python audit/run_orb.py --checkpoint checkpoints/orb.ckpt --output results/orb.json \
            2>&1 | tee results/orb.log
      - name: Check existing UMA checkpoint access
        if: inputs.phase == 'uma-access'
        shell: bash
        run: |
          set -euo pipefail
          "$AUDIT_DIR/venv/bin/python" -m pip install --disable-pip-version-check huggingface_hub==0.34.4
          "$AUDIT_DIR/venv/bin/python" "$AUDIT_DIR/audit/check_uma_access.py" "$AUDIT_DIR/results/uma_access.json"
      - name: Upload progress even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plf547-polar-${{ inputs.phase }}-${{ github.run_id }}
          path: ${{ env.AUDIT_DIR }}/results/
          if-no-files-found: warn
          retention-days: 30
