[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mace-torch-v1"
dynamic = ["version"]
description = "The PyTorch stack for MACE v1: models, training, kernel backends, deployment."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MACE developers" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
# torch enters here and nowhere else. `mace-core` stays framework-free, which
# is what lets the same contract serve the jax implementation; this package is
# the torch binding of it, so the dependency belongs at this level and is the
# whole point of the package existing separately.
#
# The floor is 2.4 because `torch.library.custom_op` and its `register_fake` /
# `register_autograd` arrived there, and the kernel dispatch is written against
# them. Earlier releases have only the `autograd.Function` route, which
# `torch.compile(fullgraph=True)` cannot see through without a graph break.
dependencies = [
    "mace-core",
    "torch>=2.4",
    # Covalent radii for the ZBL repulsion and the distance transforms.
    "ase",
]

[project.entry-points."mace.kernel_backends.torch"]
# The mandatory reference backend, discovered the same way any third-party one
# is: through an entry point, with nothing in `mace_core` naming it.
reference = "mace_torch.backends.reference:ReferenceBackend"

[project.urls]
Homepage = "https://github.com/ACEsuit/mace"

# No [project.scripts]. Every mace_* console entry point is owned by one
# distribution, mace-launcher; two distributions declaring the same script name
# is undefined behaviour in pip.

[tool.hatch.version]
source = "vcs"
# Tag prefixes are keyed on the directory, not the distribution name, so each
# package versions independently and renaming a distribution leaves the tag
# scheme alone. --match stops git describe resolving a sibling's tag or a
# legacy v0.3.x one, which tag-pattern would then reject outright.
tag-pattern = "^mace-torch-v(?P<version>.+)$"
fallback-version = "0.0.0"
raw-options = { root = "../..", git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "mace-torch-v*"] }

[tool.hatch.build.targets.wheel]
packages = ["src/mace_torch"]
