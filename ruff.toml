# The declared floor (setup.cfg: python_requires >= 3.11).
target-version = "py311"

# `mace/**` is owned by black + isort + pylint + mypy and is never reformatted:
# it is byte-frozen as the numerical oracle. The vendored trees inside it were
# always excluded from every toolchain.
extend-exclude = [
    "./mace",
]

[lint]
# The standard for new code.
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # import sorting, the ruff equivalent of isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff's own
]

[lint.per-file-ignores]
# Tests assert; they do not need the production rule set.
"tests/**" = ["B011"]
