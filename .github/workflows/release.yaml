name: Build release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-mace
      - name: Build the four independent distributions
        run: |
          for package in packages/mace-core packages/mace-torch packages/mace-jax packages/mace-backend-example; do
            python -m build "$package" --outdir dist
          done
      - name: Smoke installed wheels in an isolated environment
        run: |
          python -m venv /tmp/mace-wheel-smoke
          /tmp/mace-wheel-smoke/bin/pip install dist/*.whl
          /tmp/mace-wheel-smoke/bin/mace --help
          /tmp/mace-wheel-smoke/bin/python -c 'import mace_core, mace_torch, mace_jax; import importlib.util; assert importlib.util.find_spec("mace") is None; assert importlib.util.find_spec("e3nn") is None'
      - name: Keep candidates for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unpublished-native-candidates
          path: dist/
          if-no-files-found: error
# Tagging, GitHub Releases, PyPI and Zenodo publication belong to mace-reforge.
