# Native workspace: ruff for lint/format and ty for types.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: mixed-line-ending
    -   id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        name: Ruff lint
        files: ^(packages/|tests/parity/|tests/retirement/|tests/conftest\.py$)
        args: [--fix]
      - id: ruff-format
        name: Ruff format
        files: ^(packages/|tests/parity/|tests/retirement/|tests/conftest\.py$)

  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: ty check
        language: system
        types: [python]
        files: ^packages/
