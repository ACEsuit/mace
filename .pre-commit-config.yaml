# Two toolchains, path-scoped so that no file is governed by both.
#
#   mace/**                          black + isort + pylint + mypy
#   packages/** and the seams        ruff (lint + format) + ty
#
# The legacy tree is the byte-frozen numerical oracle the rewrite is measured
# against, so it keeps its current stack unchanged and is never reformatted: a
# reformat moves the oracle. The split is enforced by
# tests/architecture/check_toolchain_ownership.py, which fails if any path is
# claimed by both formatters or both type checkers.
#
# Everything outside those two trees stays ungoverned, as it is today. In
# particular tests/ is not formatted, by decision, and only the two declared
# seams (tests/parity/, the shared conftest) are handed to the new toolchain.

# Applied to every hook, on top of each hook's own `files:`. A path listed
# here is unreachable by any hook, whatever that hook claims, which is why the
# two seams are carved out of the tests/ entry rather than left to `files:` to
# pick up: an entry here wins.
exclude: &exclude_files >
    (?x)^(
        docs/.*|
        tests/(?!conftest\.py$|parity/).*|
        .github/.*|
        LICENSE.md|
        README.md|
    )$

# The legacy tree, and only the legacy tree.
_legacy_files: &legacy_files ^mace/

# The new tree plus the two seams the ticket names. mace_launcher lives under
# packages/, so it is already covered.
_new_files: &new_files ^(packages/|tests/parity/|tests/conftest\.py$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: mixed-line-ending
    -   id: trailing-whitespace
        exclude: *exclude_files

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        name: Black Formating
        files: *legacy_files

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        name: Sort imports
        files: *legacy_files

  - repo: https://github.com/PyCQA/pylint
    rev: pylint-2.5.2
    hooks:
    -   id: pylint
        language: system
        files: *legacy_files
        args: [
          '--disable=line-too-long',
          '--disable=no-member',
          '--disable=missing-module-docstring',
          '--disable=missing-class-docstring',
          '--disable=missing-function-docstring',
          '--disable=too-many-arguments',
          '--disable=too-many-positional-arguments',
          '--disable=too-many-locals',
          '--disable=not-callable',
          '--disable=logging-fstring-interpolation',
          '--disable=logging-not-lazy',
          '--disable=invalid-name',
          '--disable=too-few-public-methods',
          '--disable=too-many-instance-attributes',
          '--disable=too-many-statements',
          '--disable=too-many-branches',
          '--disable=import-outside-toplevel',
          '--disable=cell-var-from-loop',
          '--disable=duplicate-code',
          '--disable=use-dict-literal',
          '--max-module-lines=1600',  # mirrored in pyproject.toml
        ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        name: Ruff lint
        files: *new_files
        args: [--fix]
      - id: ruff-format
        name: Ruff format
        files: *new_files

  - repo: local
    hooks:
      # ty ships no published hook repository yet, so it runs from the ambient
      # dev environment the way pylint does.
      - id: ty
        name: ty type check
        entry: ty check
        language: system
        types: [python]
        files: *new_files
