name: extension tests
# One job per optional dependency ("extension"), each guaranteeing its
# capability via MACE_REQUIRE_CAPS: a broken install fails, never skips.
# On PRs, paths-filter runs only the extensions the PR can affect; pushes to
# main/develop always run everything (the safety net lives on the branch).
# Adding an extension = tests/extensions/<name>/ + a row in
# tests/architecture/capabilities.toml + a job. The `changes` job's outputs and
# filters are GENERATED from that manifest by
# tests/architecture/generate_ci.py; editing them here is reverted by the next
# run of the generator and failed by a meta-test in tests/architecture.

on:
  pull_request:
  workflow_dispatch:
  # Called by nightly.yaml as extensions-refresh (external git deps can break
  # on their own schedule).
  workflow_call:
  push:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-extensions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # >>> generated from capabilities.toml: filter-outputs
      # Outside a pull request the filter step below is skipped and every
      # output is empty, so the `|| 'true'` fallback runs everything.
      backends: ${{ steps.filter.outputs.backends || 'true' }}
      polar: ${{ steps.filter.outputs.polar || 'true' }}
      les: ${{ steps.filter.outputs.les || 'true' }}
      magnetic: ${{ steps.filter.outputs.magnetic || 'true' }}
      torchsim: ${{ steps.filter.outputs.torchsim || 'true' }}
      schedulefree: ${{ steps.filter.outputs.schedulefree || 'true' }}
      # <<< generated from capabilities.toml: filter-outputs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            # >>> generated from capabilities.toml: filter-paths
            shared: &shared
              - 'setup.cfg'
              - 'pyproject.toml'
              - 'tests/conftest.py'
              - 'tests/helpers.py'
              - 'tests/architecture/capabilities.toml'
              - '.github/workflows/ci-extensions.yaml'
              - '.github/actions/setup-mace/**'
              - 'mace/modules/**'
              - 'mace/tools/**'
              - 'mace/data/**'
            backends:
              - *shared
              - 'mace/cli/convert_*.py'
              - 'tests/backends/**'
              # The backend goldens live with the other goldens, not in tests/backends:
              # they are cueq/oeq tests that happen to assert against a committed
              # reference. Without this line a change to them is reviewed by no job that
              # has cuequivariance installed.
              - 'tests/golden/**'
            polar:
              - *shared
              - 'mace/cli/polar_density_cube.py'
              - 'mace/calculators/**'
              - 'tests/extensions/polar/**'
              - 'requirements/polar.txt'
              # The MACE-Polar golden lives here, and this is the only PR-time job with
              # graph_longrange, so a change to tests/golden that this job would catch
              # must be able to start it.
              - 'tests/golden/**'
            les:
              - *shared
              - 'tests/extensions/les/**'
              # The golden anchors run in this job, and two of the three surfaces they pin
              # live outside mace/modules: the external-field and BEC handling in the
              # calculator, and the eval CLI's flattened latent multipoles. Without these
              # paths a change to either would not run the job that holds its numbers.
              - 'tests/golden/**'
              - 'mace/calculators/**'
              - 'mace/cli/eval_configs.py'
              - 'requirements/les.txt'
            magnetic:
              - *shared
              - 'mace/calculators/**'
              - 'mace/cli/**'
              - 'tests/extensions/magnetic/**'
              # This job owns the magnetic goldens too: they live in tests/golden and are
              # the only place that runs them with sphericart installed, so a change there
              # has to reach it.
              - 'tests/golden/**'
            torchsim:
              - *shared
              - 'mace/calculators/**'
              - 'tests/extensions/torchsim/**'
            schedulefree:
              - *shared
              - 'tests/extensions/schedulefree/**'
            # <<< generated from capabilities.toml: filter-paths

  polar:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.polar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.10"
          extras: dev
          pip-packages: -r requirements/polar.txt
      - name: Cache foundation model downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mace
          # URLs live in foundations_models.py: new URLs -> new cache.
          key: mace-foundations-${{ hashFiles('mace/calculators/foundations_models.py') }}
      # Polar regression tests compare against released foundation models.
      # tests/golden rides along because this is the only PR-time job with
      # graph_longrange installed, and so the only one where the MACE-Polar
      # golden is more than a skip. `network` joins require-caps for the same
      # reason: the job already allows downloads, and without it a lost
      # MACE_CI_ALLOW_NETWORK would turn every foundation golden green by
      # skipping. The energy anchors in tests/golden run here too; they are
      # seconds and they are the reference the polar work is measured against.
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/extensions/polar tests/golden
          markers: not cueq and not gpu
          require-caps: polar,network
          allow-network: "true"

  polar-cueq:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.polar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.10"
          extras: dev, cueq
          pip-packages: -r requirements/polar.txt
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/extensions/polar
          markers: cueq and not gpu
          require-caps: polar,cueq
          allow-network: "true"

  les:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.les == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.10"
          extras: dev
          pip-packages: -r requirements/les.txt
      # First CI coverage of LES ever; documented xfails (see test file).
      # tests/golden rides along because the MACELES anchor is les-marked and
      # this is the only PR job with les installed at the pinned commit -- the
      # ci-core unit job runs the same directory without it and skips that one
      # file. The rest of tests/golden is unmarked and fast, so it simply runs
      # in both.
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/extensions/les tests/golden
          markers: not gpu
          require-caps: les
          allow-network: "true"

  magnetic:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.magnetic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.10"
          extras: dev, magnetic
      - uses: ./.github/actions/run-tests
        with:
          # tests/golden rides along because the magnetic goldens live there
          # and carry an explicit `magnetic` marker: in the core job, which
          # installs no extras, they skip, and this is the only job where they
          # run at all. With require-caps below, a broken sphericart install
          # fails here instead of turning them green by absence. The rest of
          # tests/golden is CPU-only and cheap, so collecting it twice costs
          # seconds and buys the anchors a second python version.
          tests: tests/extensions/magnetic tests/golden
          markers: not gpu
          require-caps: magnetic

  torchsim:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.torchsim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.12"
          extras: dev, torchsim
          # graph_longrange so the torchsim×polar tests run (they never did
          # before: the old job did not install it and they skipped silently).
          pip-packages: -r requirements/polar.txt
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/extensions/torchsim
          require-caps: torchsim,polar
          allow-network: "true"

  schedulefree:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.schedulefree == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.12"
          extras: dev, schedulefree
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/extensions/schedulefree
          markers: not gpu
          require-caps: schedulefree

  backends-cpu:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backends == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.11"
          extras: dev, cueq
      # Marker selection over the WHOLE tree, not just tests/backends: cueq
      # tests that live with their subject (training in workflows/, dielectric
      # cueq matrix in dipole_polar, calculator paths) run here too. polar+cueq
      # has its own job; gpu-only cueq runs on the fleet.
      - uses: ./.github/actions/run-tests
        with:
          tests: tests
          markers: cueq and not gpu and not polar
          require-caps: cueq
