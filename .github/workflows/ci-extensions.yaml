name: extension tests
# One job per optional dependency ("extension"), each guaranteeing its
# capability via MACE_REQUIRE_CAPS: a broken install fails, never skips.
# On PRs, paths-filter runs only the extensions the PR can affect; pushes to
# main/develop always run everything (the safety net lives on the branch).
# Optional implementations live in the native packages, with filters in
# tests/architecture/capabilities.toml + a job. The `changes` job's outputs and
# filters are GENERATED from that manifest by
# tests/architecture/generate_ci.py; editing them here is reverted by the next
# run of the generator and failed by a meta-test in tests/architecture.

on:
  pull_request:
  workflow_dispatch:
  # Called by nightly.yaml as extensions-refresh (external git deps can break
  # on their own schedule).
  workflow_call:
  push:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-extensions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # >>> generated from capabilities.toml: filter-outputs
      # Outside a pull request the filter step below is skipped and every
      # output is empty, so the `|| 'true'` fallback runs everything.
      backends: ${{ steps.filter.outputs.backends || 'true' }}
      polar: ${{ steps.filter.outputs.polar || 'true' }}
      les: ${{ steps.filter.outputs.les || 'true' }}
      magnetic: ${{ steps.filter.outputs.magnetic || 'true' }}
      torchsim: ${{ steps.filter.outputs.torchsim || 'true' }}
      schedulefree: ${{ steps.filter.outputs.schedulefree || 'true' }}
      # <<< generated from capabilities.toml: filter-outputs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            # >>> generated from capabilities.toml: filter-paths
            shared: &shared
              - 'pyproject.toml'
              - 'tests/conftest.py'
              - 'tests/helpers.py'
              - 'tests/architecture/capabilities.toml'
              - '.github/workflows/ci-extensions.yaml'
              - '.github/actions/setup-mace/**'
              - 'packages/mace-core/**'
              - 'packages/mace-torch/**'
              - 'tests/retirement/**'
            backends:
              - *shared
              - 'packages/mace-core/**'
              - 'packages/mace-torch/**'
              - 'tests/parity/**'
              - 'tests/retirement/**'
              # Frozen backend references and native backend tests share this job; changes
              # to the committed references must reach the installed optional backend.
              - 'tests/golden/**'
              - 'requirements/**'
            polar:
              - *shared
              - 'packages/mace-core/**'
              - 'packages/mace-torch/**'
              - 'tests/parity/**'
              - 'tests/retirement/**'
              # The MACE-Polar golden lives here, and this is the only PR-time job with
              # graph_longrange, so a change to tests/golden that this job would catch
              # must be able to start it.
              - 'tests/golden/**'
              - 'requirements/**'
            les:
              - *shared
              - 'packages/mace-core/**'
              - 'packages/mace-torch/**'
              - 'tests/parity/**'
              - 'tests/retirement/**'
              # The frozen LES anchor, calculator field/BEC handling and native evaluation
              # tests run with the pinned external solver.
              - 'tests/golden/**'
              - 'requirements/**'
            magnetic:
              - *shared
              - 'packages/mace-core/**'
              - 'packages/mace-torch/**'
              - 'tests/parity/**'
              - 'tests/retirement/**'
              # The native magnetic implementation is checked against the frozen magnetic
              # anchor.
              - 'tests/golden/**'
              - 'requirements/**'
            torchsim:
              - *shared
              - 'packages/mace-core/**'
              - 'packages/mace-torch/**'
              - 'tests/parity/**'
              - 'tests/retirement/**'
              - 'tests/golden/**'
              - 'requirements/**'
            schedulefree:
              - *shared
              - 'packages/mace-torch/src/mace_torch/train/**'
              - 'packages/mace-torch/tests/test_mace_torch_optimizer_modes.py'
              - 'tests/workflows/**'
            # <<< generated from capabilities.toml: filter-paths

  polar:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.polar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.11"
          extras: dev
      - name: Cache foundation model downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mace
          # URLs live in foundations_models.py: new URLs -> new cache.
          key: mace-foundations-${{ hashFiles('packages/mace-core/src/mace_core/model_registry.json') }}
      # Native Polar behavior and the committed ELEC-3 reference require no live oracle.
      - uses: ./.github/actions/run-tests
        with:
          tests: packages/mace-torch/tests/test_mace_torch_polar_model.py packages/mace-torch/tests/test_mace_torch_polar_calculator.py tests/parity/test_elec3_goldens.py
          markers: not cueq and not gpu
          require-caps: ""
          allow-network: "true"

  les:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.les == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.11"
          extras: dev
      - name: Install the pinned solver through the V1 extra
        run: python -m pip install -e packages/mace-core -e 'packages/mace-torch[les]'
      # Preserve the frozen LES anchor and exercise the installed pinned solver.
      - uses: ./.github/actions/run-tests
        with:
          tests: >-
            tests/retirement/test_frozen_anchors.py tests/golden
            packages/mace-torch/tests/test_mace_torch_maceles.py
            packages/mace-torch/tests/test_mace_torch_les_bec.py
          markers: not gpu
          require-caps: les
          allow-network: "true"

  magnetic:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.magnetic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.11"
          extras: dev
      - uses: ./.github/actions/run-tests
        with:
          # tests/golden rides along because the magnetic goldens live there
          # and carry an explicit `magnetic` marker: in the core job, which
          # installs no extras, they skip, and this is the only job where they
          # run at all. With require-caps below, a broken sphericart install
          # fails here instead of turning them green by absence. The rest of
          # tests/golden is CPU-only and cheap, so collecting it twice costs
          # seconds and buys the anchors a second python version.
          tests: packages/mace-torch/tests/test_mace_torch_magnetic_model.py packages/mace-torch/tests/test_mace_torch_time_reversal.py
          markers: not gpu
          require-caps: ""

  torchsim:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.torchsim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.12"
          extras: dev, torchsim
          # graph_longrange so the torchsim×polar tests run (they never did
          # before: the old job did not install it and they skipped silently).
          pip-packages: -r requirements/torchsim.txt
      - name: Install V1 TorchSim adapter
        run: python -m pip install -e packages/mace-core -e 'packages/mace-torch[torchsim]'
      - uses: ./.github/actions/run-tests
        with:
          tests: packages/mace-torch/tests/test_mace_torch_torchsim.py
          require-caps: torchsim
          allow-network: "true"

  schedulefree:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.schedulefree == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.12"
          extras: dev, schedulefree
      - uses: ./.github/actions/run-tests
        with:
          tests: packages/mace-torch/tests/test_mace_torch_optimizer_modes.py
          markers: not gpu
          require-caps: schedulefree

  backends-cpu:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backends == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.11"
          extras: dev, cueq
      # Marker selection includes native package and frozen-reference tests: cueq
      # tests that live with their subject (training in workflows/, dielectric
      # cueq matrix in dipole_polar, calculator paths) run here too. polar+cueq
      # has its own job; gpu-only cueq runs on the fleet.
      - uses: ./.github/actions/run-tests
        with:
          tests: packages/mace-torch/tests tests/parity
          markers: cueq and not gpu and not polar
          require-caps: cueq
