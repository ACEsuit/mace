# The declared floor (setup.cfg: python_requires >= 3.10). PEP 585 (`list[T]`)
# and PEP 604 (`X | Y`) are both natively valid here, so FA102 is a no-op over
# most of the tree — which is correct: those annotations are fine at runtime.
target-version = "py310"

# The vendored trees are excluded from every toolchain, as they always were.
extend-exclude = [
    "mace/tools/torch_geometric",
    "mace/tools/scatter.py",
]

# ...except in the code TorchScript parses. TorchScript rejects `X | Y` in a
# type expression on torch < 2.2 ("Expression of type | cannot be used in a
# type expression"), and `from __future__ import annotations` does NOT rescue
# it. setup.cfg declares torch>=1.12, so `X | Y` in a scripted module would
# break users on torch 1.12-2.1. Pinning these files to py39 keeps FA102 firing
# on them as an early warning. PEP 585 is safe as far back as torch 1.13, so
# only the union syntax is at issue.
#
# This is every file carrying @compile_mode("script"). Keep it in sync with
#   git grep -l '@compile_mode' mace/
[per-file-target-version]
"mace/modules/**" = "py39"
"mace/calculators/lammps_mace.py" = "py39"
"mace/calculators/lammps_mliap_mace.py" = "py39"

[lint]
# The standard for new code. The legacy tree is held to FA102 alone, below:
# it is byte-frozen as the numerical oracle, and a reformat moves it.
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # import sorting, the ruff equivalent of isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff's own
    "FA102",  # the TorchScript guard above
]

[lint.per-file-ignores]
# `mace/**` is owned by black + isort + pylint + mypy and is never reformatted.
# Ruff keeps exactly one rule there, the TorchScript union guard, which is why
# this is an ignore list rather than an exclusion: an exclusion would drop that
# guard as well. Ruff *format* never touches the tree at all, which is the half
# that could move it.
#
# The guard is invoked by legacy-lint's `ruff check mace/` step, not by a hook:
# the ruff hooks are scoped to the new tree and that job skips them, so without
# the step this list would describe a rule that runs nowhere.
"mace/**" = [
    "F", "E", "W", "I", "UP", "B", "SIM", "RUF",
]
# Tests assert; they do not need the production rule set.
"tests/**" = ["B011"]
