[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mace-core"
dynamic = ["version"]
description = "Framework-agnostic contract and pure math for MACE v1."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MACE developers" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
# numpy is the array type every value in this package is expressed over.
#
# ase is here deliberately, and it is the one dependency that looks like it
# does not belong in a framework-agnostic package. The extended-XYZ contract
# this package parses is *defined* in terms of ase: which of info/arrays a key
# lands in, which keys are reserved for calculator results, how a cell and its
# periodic-boundary flags are spelled. Reimplementing that would mean
# reimplementing ase's decisions and then differing from them on some file
# nobody tested. ase brings in no framework of its own, so the purity rule --
# no torch, no jax, no e3nn -- is untouched. The floor is 3.23 because that is
# the release whose reserved-key behaviour the parser is written against.
dependencies = [
    "numpy>=1.23",
    "ase>=3.23",
]

[project.urls]
Homepage = "https://github.com/ACEsuit/mace"

# No [project.scripts]. Every mace_* console entry point is owned by one
# distribution, mace-launcher; two distributions declaring the same script name
# is undefined behaviour in pip.

[tool.hatch.version]
source = "vcs"
# Tag prefixes are keyed on the directory, not the distribution name, so each
# package versions independently and renaming a distribution leaves the tag
# scheme alone. --match stops git describe resolving a sibling's tag or a
# legacy v0.3.x one, which tag-pattern would then reject outright.
tag-pattern = "^mace-core-v(?P<version>.+)$"
fallback-version = "0.0.0"
raw-options = { root = "../..", git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "mace-core-v*"] }

[tool.hatch.build.targets.wheel]
packages = ["src/mace_core"]
