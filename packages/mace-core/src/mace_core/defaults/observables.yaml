# The canonical observable declarations: energy, and its derivatives with
# respect to the two inputs every model has.
#
# This file is the example every other observable copies. A new property is a
# row here (or in a project's own file) and needs no code: the spec drives the
# head, the loss term, the derivative names and the per-atom/per-graph padding.
#
# A derivative with a name of its own declares it here, together with the sign
# it is reported with, rather than being special-cased in code. Leave both out
# and it is called `d_<quantity>_d_<input>` and carries the gradient's own
# sign; give a name and the sign becomes required, because a renamed quantity
# that silently inherited +1 is a model trained on inverted forces that runs.
#
# Units follow the project convention: eV and Å. The strain is dimensionless,
# so its input row carries "1".

inputs:
  # Atomic positions. A polar vector: it changes sign under inversion, which is
  # what makes the energy gradient taken against it a 1o quantity as well.
  - name: pos
    irreps: "1o"
    per_atom: true
    units: "Å"

  # The symmetric strain the stress is the derivative against, not the nine
  # cell entries: a symmetric rank-2 tensor is a scalar plus an l=2 part, six
  # components. Unlike `pos` it is not read from the data. The derivative
  # engine materialises it as zeros around the model call and applies it to
  # the positions and the cell, which is how the frozen tree does it too.
  - name: strain
    irreps: "0e+2e"
    per_atom: false
    units: "1"

observables:
  - name: energy
    irreps: "0e"
    per_atom: false
    units: "eV"
    derivatives:
      - wrt: pos
        name: forces
        sign: -1
        units: "eV/Å"
      # The volume division that turns the strain derivative into a stress is
      # not a sign, and does not belong here. It is applied by whatever
      # computes the stress.
      - wrt: strain
        name: stress
        sign: +1
        units: "eV/Å^3"
