name: nightly
# Everything too expensive, network-dependent or non-gating for the PR path:
# foundation-model tests (downloads), the full-matrix e2e training suite,
# external-dep refresh (polar/les install from git and can break on their
# own), CPU benchmarks, the real-tier LAMMPS integration, and the durations
# refresh. GPU nightly coverage runs via ci-gpu-mpcdf.yaml's own schedule.

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  frozen-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.12"
          extras: dev
      - name: Install the v1 parity stack
        run: python -m pip install -e packages/mace-core -e packages/mace-torch
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/parity tests/retirement
          markers: not gpu and not slow
          numprocs: "0"
          timeout: "1200"
          extra-args: --hypothesis-seed=${{ github.run_id }}

  foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.12"
          extras: dev
          # graph_longrange so the polar foundation loaders run too.
          pip-packages: -r requirements/polar.txt -e packages/mace-core -e packages/mace-torch -e packages/mace-jax
      - name: Cache foundation model downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mace
          # Invalidate for either the frozen URLs or the native registry.
          key: mace-foundations-${{ hashFiles('packages/mace-core/src/mace_core/model_registry.json') }}
      # Downloads are allowed and REQUIRED here: a broken download host
      # must turn this job red, never a PR.
      #
      # tests/golden joins the selection for its `network`-marked foundation
      # goldens: they are the only place a re-uploaded or re-pointed
      # published artifact is caught, and with require-caps below they fail
      # here rather than skipping. The unmarked goldens in that directory run
      # again here, which is cheap and means a nightly is a complete
      # statement about the golden set.
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/foundations tests/golden
          markers: not gpu
          require-caps: network
          allow-network: "true"
          timeout: "1200"
        env:
          MACE_REGISTRY_BADGES: .pytest_cache/registry-badges
      - name: Export registry labels
        if: always()
        run: python -c "from mace_core.model_registry import export_registry; export_registry('.pytest_cache/registry-badges/registry.json')"
      - name: Upload native support matrix
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-registry-badges
          path: .pytest_cache/registry-badges
          include-hidden-files: true
          if-no-files-found: error

  workflows-full:
    runs-on: ubuntu-latest
    name: workflows-full (py${{ matrix.python-version }}, group ${{ matrix.split-group }})
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]
        split-group: [ 1, 2 ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: ${{ matrix.python-version }}
          # wandb for the same reason as the PR-time workflows job: the flags
          # are only tested where the client is installed.
          extras: dev, wandb
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift \
            /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/chromium /opt/microsoft /opt/google
      # The e2e suite INCLUDING its network-marked tests (the PR path
      # runs this suite without network).
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/workflows
          require-caps: wandb
          splits: "2"
          group: ${{ matrix.split-group }}
          allow-network: "true"
          timeout: "1200"

  extensions-refresh:
    # Re-runs the extension jobs even when nobody touched the repo: polar/les
    # install from external git and can break on their own.
    uses: ./.github/workflows/ci-extensions.yaml
    permissions:
      contents: read

  benchmarks:
    # Native timings on the committed anchor at three fixed sizes and two
    # precisions. Historical legacy timings stay external frozen artifacts.
    # pytest-benchmark disables itself under xdist, so use numprocs 0.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.12"
          extras: dev
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/benchmarks
          # Deliberately no marker expression: every narrowing applied here so
          # far has ended with an empty artifact. The gpu-marked cases skip on
          # this runner and say so.
          allow-network: "true"
          require-caps: ""
          numprocs: "0"
          timeout: "3600"
          extra-args: --benchmark-json=benchmark.json
      # THE check that this job stopped being green-while-measuring-nothing.
      #
      # `if-no-files-found: error` on the upload below cannot catch it:
      # pytest-benchmark creates the --benchmark-json path regardless of what
      # ran, and a session in which every case skipped leaves a **0-byte
      # file** behind (reproduced locally: `pytest tests/benchmarks/
      # test_benchmark.py --benchmark-json=...` -> 16 skipped, 0-byte json).
      # So the file is always present, the upload always succeeds, and the
      # only thing that distinguishes a baseline from an empty artifact is its
      # contents. Hence a content assertion rather than a presence one.
      #
      # It also checks one case per declared size, because the hole this job
      # had was size-shaped: skipping is per-parametrization, so a single
      # surviving case would satisfy "non-empty" while the size spread the
      # downstream comparison needs had quietly gone.
      - name: The artifact must actually contain a baseline
        run: |
          python - <<'PY'
          import json, pathlib, sys
          raw = pathlib.Path("benchmark.json").read_text() or "{}"
          runs = json.loads(raw).get("benchmarks", [])
          if not runs:
              sys.exit(
                  "benchmark.json carries no benchmarks: every case skipped "
                  "and this job would have published an empty baseline."
              )
          sizes = {b.get("extra_info", {}).get("regime") for b in runs}
          missing = {"subdomain216", "subdomain512", "kernel1728"} - sizes
          if missing:
              sys.exit(f"no benchmark ran at size(s) {sorted(missing)}")
          for b in runs:
              info = b.get("extra_info", {})
              absent = [
                  k for k in ("dtype", "device", "torch_version", "backend")
                  if not info.get(k)
              ]
              if absent:
                  sys.exit(f"{b['name']} records no {absent}: not reproducible")
          print(f"{len(runs)} benchmarks across sizes {sorted(sizes)}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # always(), so the artifact is there to diagnose a failed content check
        # rather than only on the nights that pass it.
        if: always()
        with:
          name: benchmark-json
          path: benchmark.json
          retention-days: 90
          if-no-files-found: error

  lammps-real:
    # ML-IAP must accumulate ghost-centered pair forces for V1's full-shell
    # multi-layer path. The date reported by older builds cannot distinguish it.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.11"
          extras: dev, cueq
          pip-packages: Cython==3.2.9
      - run: python -m pip install -e packages/mace-core -e packages/mace-torch
      - name: Check out LAMMPS with complete ML-IAP force accumulation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: lammps/lammps
          ref: 611ca3b7f8525ba802373b04f9e3d632d515f7e3 # stable_22Jul2025_update4
          path: .mliap-build/lammps
          sparse-checkout: |
            cmake
            src
            python
      - name: Build and install CPU ML-IAP with Python support
        run: |
          root="$PWD/.mliap-build"
          cmake -S "$root/lammps/cmake" -B "$root/build" \
            -D CMAKE_BUILD_TYPE=Release -D BUILD_SHARED_LIBS=ON \
            -D BUILD_MPI=OFF -D BUILD_OMP=OFF -D PKG_ML-IAP=ON \
            -D PKG_ML-SNAP=ON -D PKG_PYTHON=ON -D MLIAP_ENABLE_PYTHON=ON \
            -D Python_EXECUTABLE="$(command -v python)" \
            -D Cythonize_EXECUTABLE="$(command -v cythonize)"
          cmake --build "$root/build" -j 3
          LAMMPS_VERSION_FILE="$root/lammps/src/version.h" \
            python -m pip install --no-deps "$root/lammps/python"
          python - <<'PY'
          import shutil
          from pathlib import Path
          import lammps

          shutil.copy2(
              ".mliap-build/build/liblammps.so",
              Path(lammps.__file__).parent / "liblammps.so",
          )
          with lammps.lammps(cmdargs=["-log", "none", "-screen", "none"]) as instance:
              print("LAMMPS version:", instance.version())
          PY
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/integrations tests/parity/test_mliap.py
          markers: bin_lammps and not gpu
          require-caps: bin_lammps
          numprocs: "0"
          timeout: "1200"

  lammps-native-mpi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.11"
          extras: dev
      - run: python -m pip install -e packages/mace-core -e packages/mace-torch
      - name: Check out the LAMMPS plugin API for the native MPI tier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: lammps/lammps
          ref: 611ca3b7f8525ba802373b04f9e3d632d515f7e3 # stable_22Jul2025_update4
          path: .native-build/lammps
          sparse-checkout: |
            cmake
            src
      - name: Check energy and forces across two native MPI ranks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mpich libmpich-dev
          root="$PWD/.native-build"
          cmake -S "$root/lammps/cmake" -B "$root/build" -D BUILD_SHARED_LIBS=ON \
            -D BUILD_MPI=ON -D MPI_CXX_COMPILER="$(command -v mpicxx.mpich)" \
            -D PKG_PLUGIN=ON -D BUILD_OMP=OFF -D CMAKE_BUILD_TYPE=Release
          cmake --build "$root/build" -j 3
          cmake -S packages/mace-torch/lammps -B "$root/plugin" \
            -D LAMMPS_SOURCE_DIR="$root/lammps" -D LAMMPS_LIBRARY="$root/build/liblammps.so" \
            -D MPI_CXX_COMPILER="$(command -v mpicxx.mpich)" -D Python3_EXECUTABLE="$(command -v python)"
          cmake --build "$root/plugin" -j 2
          export MACE_NATIVE_PLUGIN="$root/plugin/mace_native.so" MACE_NATIVE_LMP="$root/build/lmp"
          export MPIEXEC=mpiexec.mpich TORCHINDUCTOR_COMPILE_THREADS=1 OMP_NUM_THREADS=1
          pytest -q tests/parity/test_native_lammps.py -m 'not gpu' --timeout=600

  openmm-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.11"
          extras: dev
      - run: python -m pip install -e packages/mace-core -e packages/mace-torch -r requirements/openmm.txt
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: openmm/openmm-torch
          ref: b6532900ad825cb3d12193817a1e34a7f46ae6a3
          path: .openmm-build/source
      - name: Build the direct PyTorch interface
        run: |
          openmm_prefix="$(python -c 'import openmm, pathlib; print(pathlib.Path(openmm.__file__).parent.parent / "OpenMM.libs")')"
          torch_prefix="$(python -c 'import torch, pathlib; print(pathlib.Path(torch.__file__).parent)')"
          cmake -S .openmm-build/source -B .openmm-build/build \
            -D CMAKE_POLICY_VERSION_MINIMUM=3.5 -D CMAKE_BUILD_TYPE=Release \
            -D OPENMM_DIR="$openmm_prefix" -D PYTORCH_DIR="$torch_prefix" \
            -D CMAKE_INSTALL_PREFIX="$openmm_prefix" \
            -D PYTHON_EXECUTABLE="$(command -v python)" \
            -D NN_BUILD_OPENCL_LIB=OFF -D NN_BUILD_CUDA_LIB=OFF -D NN_BUILD_HIP_LIB=OFF
          cmake --build .openmm-build/build --target OpenMMTorch OpenMMTorchReference -j 2
          cmake --install .openmm-build/build
          cmake --build .openmm-build/build --target PythonInstall
      - uses: ./.github/actions/run-tests
        with:
          tests: packages/mace-torch/tests/test_mace_torch_openmm_integration.py
          markers: bin_openmm
          require-caps: bin_openmm
          numprocs: "0"
          timeout: "600"

  libmace-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.11"
          extras: dev
      - run: python -m pip install -e packages/mace-core -e packages/mace-torch
      - run: sudo apt-get update && sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: stenczelt/libmace
          ref: e3413ae658530654894b6bac6a62a764a74c5115
          path: .libmace-build/source
      - name: Build the native libmace runtime and Fortran module
        run: |
          cmake -S packages/mace-torch/libmace -B .libmace-build/native \
            -D CMAKE_BUILD_TYPE=Release -D Python3_EXECUTABLE="$(command -v python)" \
            -D LIBMACE_SOURCE_DIR="$PWD/.libmace-build/source" \
            -D CMAKE_INSTALL_PREFIX="$PWD/.libmace-build/install"
          cmake --build .libmace-build/native -j 2
          cmake --install .libmace-build/native
          cmake -S tests/integrations/libmace/consumer -B .libmace-build/consumer \
            -D CMAKE_PREFIX_PATH="$PWD/.libmace-build/install"
          cmake --build .libmace-build/consumer -j 2
          echo "MACE_LIBMACE_DRIVER=$PWD/.libmace-build/consumer/mace_libmace_driver" >> "$GITHUB_ENV"
          echo "MACE_LIBMACE_FORTRAN=$PWD/.libmace-build/consumer/mace_libmace_fortran" >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/integrations/libmace tests/parity/test_libmace.py
          markers: not gpu
          require-caps: bin_libmace
          numprocs: "0"
          timeout: "600"

  gromacs-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.11"
          extras: dev
      - run: python -m pip install -e packages/mace-core -e packages/mace-torch
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: stenczelt/libmace
          ref: e3413ae658530654894b6bac6a62a764a74c5115
          path: .gromacs-build/libmace-source
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: gromacs/gromacs
          ref: 121090014570a53a17ea391bcddae45e5ea05eb4
          path: .gromacs-build/source
      - name: Build the native runtime and MD adapters
        run: |
          root="$PWD/.gromacs-build"
          cmake -S packages/mace-torch/libmace -B "$root/native" \
            -D CMAKE_BUILD_TYPE=Release -D Python3_EXECUTABLE="$(command -v python)" \
            -D LIBMACE_SOURCE_DIR="$root/libmace-source" -D MACE_WITH_FORTRAN=OFF \
            -D CMAKE_INSTALL_PREFIX="$root/install"
          cmake --build "$root/native" -j 2
          cmake --install "$root/native"
          cmake -D GROMACS_SOURCE_DIR="$root/source" -P packages/mace-torch/gromacs/apply.cmake
          cmake -S "$root/source" -B "$root/build" \
            -D CMAKE_BUILD_TYPE=Release -D CMAKE_CXX_STANDARD=20 -D GMX_NNPOT=MACE \
            -D CMAKE_PREFIX_PATH="$root/install" \
            -D MACE_GROMACS_SOURCE_DIR="$PWD/packages/mace-torch/gromacs" \
            -D GMX_FFT_LIBRARY=fftpack -D GMX_SIMD=NONE -D GMX_OPENMP=OFF -D GMX_GPU=OFF \
            -D BUILD_TESTING=OFF -D GMX_DOUBLE=ON -D GMXAPI=OFF -D GMX_INSTALL_NBLIB_API=OFF \
            -D GMX_USE_PLUMED=OFF -D GMX_USE_COLVARS=NONE -D GMX_VERSION_STRING_OF_FORK=MACE-V1-AOT
          cmake --build "$root/build" -j 2
          echo "MACE_GROMACS_BINARY=$root/build/bin/gmx_d" >> "$GITHUB_ENV"
          python -m pip install openmm==8.6.1
          openmm_prefix="$(python -c 'import openmm, pathlib; print(pathlib.Path(openmm.__file__).parent.parent / "OpenMM.libs")')"
          cmake -S packages/mace-torch/openmm -B "$root/openmm" \
            -D CMAKE_BUILD_TYPE=Release -D CMAKE_PREFIX_PATH="$root/install;$openmm_prefix" \
            -D CMAKE_INSTALL_PREFIX="$root/install"
          cmake --build "$root/openmm" -j 2
          cmake --install "$root/openmm"
          cmake -S tests/integrations/openmm/consumer -B "$root/openmm-client" \
            -D CMAKE_PREFIX_PATH="$root/install"
          cmake --build "$root/openmm-client" -j 2
          echo "MACE_OPENMM_DRIVER=$root/openmm-client/mace_openmm_driver" >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/integrations/gromacs tests/parity/test_gromacs.py tests/integrations/openmm/test_native_contract.py tests/parity/test_openmm_native.py
          markers: not gpu
          require-caps: bin_gromacs,bin_openmm_native
          numprocs: "0"
          timeout: "600"

  packages-workspace:
    # Validate the installed native workspace across supported Python versions.
    runs-on: ubuntu-latest
    name: packages-workspace (py${{ matrix.python-version }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # hatch-vcs reads each version off `git describe`; a shallow clone
          # carries no tags and every package would build as its fallback.
          fetch-depth: 0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Import the native workspace
        run: python -c "import mace_core, mace_torch; print('native workspace ok')"
      - uses: ./.github/actions/run-tests
        with:
          tests: packages/mace-core/tests packages/mace-torch/tests tests/architecture
          numprocs: "0"

  coverage-full:
    # THE project coverage number: full fixed CPU scope (network, cueq, polar,
    # les, torchsim, schedulefree), comparable night to night. The per-PR
    # coverage job measures only the deterministic PR slice by design.
    #
    # Sharded, one xdist worker per shard, because this is the ONLY job that
    # installs every extra at once: extensions-refresh runs polar, les,
    # torchsim and backends-cpu in separate jobs, and durations-refresh runs
    # the same paths with `dev` alone, so they all skip the heavy ones. On
    # 2026-08-06 the single job died at 87% with the runner itself killed
    # ("the runner has received a shutdown signal") while one worker was in a
    # cueq CPU-fallback polar case and the other was loading the omol
    # foundation model. Shards bound both the concurrent peak and how much a
    # single process accumulates; `[METRICS] mem/peak rss` in the log says
    # which of the two it was, should it come back.
    name: coverage-full (group ${{ matrix.split-group }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        split-group: [ 1, 2, 3 ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.12"
          extras: dev, cueq, torchsim, schedulefree, wandb
          pip-packages: -r requirements/les.txt
      - name: Cache foundation model downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mace
          key: mace-foundations-${{ hashFiles('packages/mace-core/src/mace_core/model_registry.json') }}
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift \
            /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/chromium /opt/microsoft /opt/google
      - uses: ./.github/actions/run-tests
        with:
          tests: tests packages/mace-core/tests packages/mace-torch/tests packages/mace-jax/tests
          markers: not gpu and not benchmark and not nightly
          require-caps: network,cueq,les,torchsim,schedulefree,wandb
          allow-network: "true"
          coverage: "data"
          splits: "3"
          group: ${{ matrix.split-group }}
          numprocs: "1"
          timeout: "1200"
      - name: Name this shard's coverage data
        run: mv .coverage ".coverage.${{ matrix.split-group }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ matrix.split-group }}
          path: .coverage.${{ matrix.split-group }}
          retention-days: 7
          # A dotfile, and upload-artifact skips hidden files by default --
          # the same trap that silently emptied the durations upload.
          include-hidden-files: true

  coverage-report:
    # Each shard measures a third of the suite: this is where the nightly
    # coverage number is actually produced. Deliberately NOT `if: always()` --
    # a report combined from a subset of the shards would read as the project
    # number while missing whatever the failed shard covered.
    needs: coverage-full
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # `coverage` alone, not the whole dev stack: combining and reporting
      # needs the data files and the sources, not an importable mace.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install "coverage[toml]"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine the shards
        run: |
          coverage combine
          coverage xml
          coverage html
      - name: Coverage summary
        run: |
          {
            echo '## Full-scope CPU coverage (nightly)'
            echo '```'
            coverage report --skip-covered --sort=cover | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ github.token }}
          file: coverage.xml
          format: cobertura
          fail-on-error: false
      # THE coverage gate. The overall percentage above stays informative in
      # both this job and the per-PR one; only the files listed below are
      # enforced.
      #
      # WHY ONLY THESE FILES. The rewrite's test-prerequisite bar is golden
      # characterization + end-to-end contracts + line-coverage floors on the
      # modules whose *behaviour* ports. There is deliberately no global
      # target: the native implementation is pinned by the goldens in
      # tests/golden and the CLI/calculator contracts in tests/workflows, and
      # a global number would be a second, weaker statement about the same
      # code. These six are the pure-math and physics-glue modules that have
      # no golden standing in for them.
      #
      # Floors follow each capability into the native implementation. They
      # run only after all three coverage shards have been combined. The PR
      # coverage job reports these values without enforcing them because its
      # test selection is narrower. Historical legacy percentages are not
      # measurements of these native files; retain the existing thresholds
      # and validate them under the full native nightly selection.
      - name: Per-file coverage floors
        run: |
          status=0
          echo '## Per-file coverage floors' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          while read -r file floor; do
            case "$file" in ''|'#'*) continue ;; esac
            if report=$(coverage report --include="$file" --fail-under="$floor" 2>&1); then
              verdict='ok'
            else
              verdict='BELOW FLOOR'
              status=1
            fi
            printf '%-34s >= %3s%%  %s\n' "$file" "$floor" "$verdict" \
              >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n%s\n' "--- $file (floor ${floor}%): $verdict" "$report"
          done <<'FLOORS'
          # >>> generated from capabilities.toml: coverage-floors
          # Generated by tests/architecture/generate_ci.py from the coverage_floors entries of
          # tests/architecture/capabilities.toml. The comment above each group
          # is the capability that owns those floors: when it ports to
          # packages/, its floors move with it, in the same commit, by editing
          # the manifest and re-running the generator.
          # energy
          packages/mace-torch/src/mace_torch/train/loss.py 90
          packages/mace-torch/src/mace_torch/nn/radial.py 90
          packages/mace-torch/src/mace_torch/physics/outputs.py 85
          # data
          packages/mace-core/src/mace_core/data/configuration.py 85
          packages/mace-core/src/mace_core/neighbors/neighborhood.py 95
          packages/mace-core/src/mace_core/graph/collate.py 85
          # <<< generated from capabilities.toml: coverage-floors
          FLOORS
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # always(), so the html report that explains a floor failure is
        # available on the run that failed.
        if: always()
        with:
          name: coverage-full
          path: |
            coverage.xml
            htmlcov/
          retention-days: 90

  durations-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.11"
          extras: dev
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift \
            /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/chromium /opt/microsoft /opt/google
      - uses: ./.github/actions/run-tests
        with:
          tests: tests packages/mace-core/tests packages/mace-torch/tests packages/mace-jax/tests
          allow-network: "true"
          store-durations: "true"
          markers: not nightly
          timeout: "1200"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-durations
          path: tests/.test_durations
          retention-days: 30
          # The path is a dotfile and upload-artifact skips hidden files by
          # default: without this the job stayed green while uploading nothing,
          # so the committed durations silently went stale.
          include-hidden-files: true
