# GPU pipeline executed on the MPCDF shared runners (gitlab.mpcdf.mpg.de).
#
# This file is NOT a repository-root .gitlab-ci.yml on purpose: nothing in
# GitHub reads it. The `gpu tests (MPCDF)` workflow copies it to
# `.gitlab-ci.yml` on a throwaway branch, pushes that branch to a mirror
# project at MPCDF and starts the pipeline through the API. Keeping it here
# means the GitHub repository carries no top-level GitLab configuration.
#
# The MPCDF instance runs GitLab Community Edition, so the built-in GitHub
# integration (mirror + status reporting) is unavailable; the direction of
# control is therefore GitHub -> GitLab, never the reverse.

# Only API-created pipelines run. Without this the `git push` performed by the
# bridge would start a second, redundant pipeline for the same commit.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "api"
    - when: never

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DEFAULT_TIMEOUT: "120"
  GIT_DEPTH: "1"

stages:
  - test

# A plain Python image is enough wherever the PyTorch wheels suffice: they
# ship their own runtime libraries and only need the driver, which the runner
# exposes into the container. The exception is OpenEquivariance, which
# JIT-compiles its kernels and therefore needs a real toolkit, so that job
# overrides the image below. Being containers is exactly what makes this
# possible here and not on a shared machine nobody wants to install nvcc on.
.gpu:
  stage: test
  image: python:3.11
  timeout: 2h
  # The venv is cached alongside the pip downloads: reinstalling the whole
  # stack dominates the runtime otherwise. Reusing it is safe because every
  # install below still runs, so a changed dependency is picked up; a warm
  # cache only turns those installs into no-ops. The key follows setup.cfg so
  # a dependency edit starts from a clean slate anyway.
  cache:
    key:
      files:
        - setup.cfg
      prefix: "$CI_JOB_NAME"
    paths:
      - .cache/pip
      - .venv
  before_script:
    - python3 -V
    # A cached venv built under a different interpreter (an image change, a
    # Python upgrade) leaves dangling symlinks that fail much later and much
    # more confusingly than here.
    - .venv/bin/python -V > /dev/null 2>&1 || rm -rf .venv
    - test -d .venv || python3 -m venv .venv
    - . .venv/bin/activate
    - python -m pip install -U pip
  script:
    - |
      if [ -n "$TORCH_INDEX" ]; then
        python -m pip install --retries 5 torch --index-url "$TORCH_INDEX"
      fi
    - python -m pip install --retries 5 ".[${EXTRAS}]"
    - |
      for req in $PIP_REQUIREMENTS; do
        python -m pip install --retries 5 -r "$req"
      done
    - python -m pip freeze
    # Fail loudly rather than silently running the CPU path: a runner that
    # hands us no GPU must not report a green pipeline.
    - |
      python - <<'PY'
      import torch
      print("torch:", torch.__version__)
      print("cuda:", torch.version.cuda, "| hip:", torch.version.hip)
      if not torch.cuda.is_available():
          raise SystemExit("No GPU is visible to torch on this runner")
      print("device:", torch.cuda.get_device_name(0))
      PY
    # MACE_REQUIRE_CAPS turns a broken backend install into a failure instead
    # of a skip, the same contract the GitHub jobs use (tests/conftest.py).
    - >
      MACE_REQUIRE_CAPS="$REQUIRE_CAPS"
      python -m pytest tests
      -m "($MARKER_EXPR) and not benchmark"
      -n 2 --timeout 1200 -ra

# ONLY_VENDOR is set by the bridge so each GitHub job drives a pipeline
# containing a single vendor, and the two report as independent checks. Unset
# (a pipeline started by hand) runs both.
gpu-nvidia:
  extends: .gpu
  rules:
    - if: '$ONLY_VENDOR == null || $ONLY_VENDOR == "" || $ONLY_VENDOR == "nvidia"'
  # The CUDA toolkit image is what buys OpenEquivariance: it JIT-compiles its
  # kernels with nvcc, so a driver-only host cannot run those tests at all.
  # The major version tracks the default PyTorch wheels (cu13).
  image: nvidia/cuda:13.0.3-devel-ubuntu24.04
  before_script:
    - apt-get update
    - >
      apt-get install -y --no-install-recommends
      python3 python3-venv python3-dev build-essential git
    - !reference [ .gpu, before_script ]
  tags:
    - mpcdf-shared
    - gpu-nvidia
  variables:
    CUDA_HOME: /usr/local/cuda
    TORCH_INDEX: ""
    EXTRAS: "dev,cueq,cueq-cuda-12,oeq,schedulefree"
    PIP_REQUIREMENTS: "requirements/polar.txt requirements/les.txt"
    REQUIRE_CAPS: "gpu,cueq,oeq,polar,les,schedulefree"
    MARKER_EXPR: "gpu"

# cuEquivariance is NVIDIA-only, hence the narrower marker expression. This
# job is deliberately not allow_failure: it surfaces as its own check on the
# GitHub side, so whether a red AMD blocks a merge is a branch-protection
# decision there rather than something hidden inside the pipeline.
gpu-amd:
  extends: .gpu
  rules:
    - if: '$ONLY_VENDOR == null || $ONLY_VENDOR == "" || $ONLY_VENDOR == "amd"'
  tags:
    - mpcdf-shared
    - gpu-amd
  variables:
    TORCH_INDEX: "https://download.pytorch.org/whl/rocm6.3"
    EXTRAS: "dev,schedulefree"
    PIP_REQUIREMENTS: "requirements/polar.txt requirements/les.txt"
    REQUIRE_CAPS: "gpu,polar,les,schedulefree"
    MARKER_EXPR: "gpu and not cueq"
