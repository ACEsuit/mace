target-version = "py311"

[lint]
# The standard for new code.
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # import sorting, the ruff equivalent of isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff's own
]

[lint.per-file-ignores]
# Tests assert; they do not need the production rule set.
"tests/**" = ["B011"]
