name: core tests
# Required PR checks: lint + the CPU-only core suites. Everything here is
# deterministic (no network: foundation-download tests live in nightly.yaml).
# Test jobs run through the .github/actions/run-tests composite action —
# the single place that assembles the pytest command (see its inputs to
# reproduce any job locally).

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  legacy-lint:
    # The frozen tree's toolchain: black + isort + pylint, plus mypy against a
    # committed baseline. It runs the hooks scoped to mace/** in
    # .pre-commit-config.yaml, so a violation in packages/** cannot fail it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          # 3.10, the version .mypy.ini declares. mypy parses third-party stubs
          # against python_version, and numpy 2.5's are PEP 695, so on a newer
          # interpreter the run stops at a parse error and checks nothing. The
          # hooks pass identically on 3.10.
          python-version: "3.10"
          extras: dev
          # The pylint hook is `language: system`: packages the linted code
          # imports must be importable in this environment.
          pip-packages: wandb
      - name: Install the v1 packages
        # pylint resolves imports against this environment, and the seams
        # import the new packages, so both trees have to be present even
        # though this job only lints one of them.
        run: |
          python -m pip install -e packages/mace-core \
                                -e packages/mace-torch \
                                -e packages/mace-jax
      - name: Legacy hooks
        # `pre-commit run` takes at most one hook id, so the new toolchain's
        # hooks are skipped by name instead. That is what keeps a packages/**
        # violation out of this job: the hooks are path-scoped, but running
        # them here at all would report the other tree's failures as this
        # tree's.
        env:
          SKIP: ruff-check,ruff-format,ty
        run: pre-commit run --all-files --show-diff-on-failure
      - name: TorchScript union guard
        # ruff over mace/ is reduced by ruff.toml to FA102 alone. It runs here,
        # in the job that owns the frozen tree, rather than as a hook: the ruff
        # hooks are scoped to the new tree and skipped by this job, so the
        # guard would otherwise be configured and never invoked. Linting does
        # not rewrite a file, so this does not make ruff a second owner.
        run: ruff check mace/
      - name: mypy against the committed baseline
        # mypy has never run here, so the frozen tree carries a backlog it is
        # not this migration's job to fix: the tree is the numerical oracle and
        # editing it moves the oracle. Only a new error fails.
        run: python tests/architecture/check_mypy_baseline.py

  packages-lint:
    # The new tree's toolchain: ruff lint, ruff format and ty, scoped to
    # packages/** and the two seams.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # hatch-vcs derives each package version from git describe.
          fetch-depth: 0
      - uses: actions/setup-python@e9d6f990972a57673cdb72ec29e19d42ba28880f # v6.0.0
        with:
          python-version: "3.12"
      - name: Install the v1 packages and the new toolchain
        # No legacy install: the new toolchain must not need it, and a job that
        # installed it would stop noticing if that changed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/mace-core \
                                -e packages/mace-torch \
                                -e packages/mace-jax \
                                -e packages/mace-launcher
          # Pinned to the same versions as the dev extra and the
          # ruff-pre-commit rev, so this job and a developer's machine
          # cannot reach different verdicts.
          # pytest too: the packages' own tests import it, and ty has to
          # resolve every import or it reports the absence as an error.
          python -m pip install ruff==0.16.5 ty==0.0.77 pytest
      - name: Ruff lint and format
        # The same set the ruff hooks claim in .pre-commit-config.yaml. A list
        # written out here drifts from that one silently, and the drift shows
        # up as a file that passes CI and fails pre-commit, which is the
        # disagreement this split exists to prevent. tests/parity/ is created
        # by PAR-1 and ruff errors on a path that does not exist yet, so it
        # joins the set the moment it appears.
        run: |
          paths="packages/ tests/conftest.py"
          [ -d tests/parity ] && paths="$paths tests/parity/"
          echo "checking: $paths"
          ruff check $paths
          ruff format --check $paths
      - name: ty
        # packages/ only: see the ty hook in .pre-commit-config.yaml.
        run: ty check packages/

  cueq-wheel-extras:
    # The `cueq*` extras name wheels no PR job installs: the GPU pipeline pulls
    # cueq-cuda-13 and nothing anywhere touches cu11 or cu12. The only failure
    # mode of an extras group is a job resolving it, so no test in the suite can
    # stand in for this.
    #
    # It is here rather than in the nightly because it is cheap: the ops wheels
    # are a few hundred kilobytes each and `--dry-run` stops at a resolution, so
    # the whole job is seconds. It needs no GPU either -- these are ordinary
    # manylinux artifacts, and only running them would want a device.
    #
    # No `--platform` flag. pip matches platform tags exactly when told one, so
    # naming a tag resolves nothing for the packages that ship a different one:
    # the runner's own tags are the only set that is right for all of them.
    #
    # The list is read out of `setup.cfg`, not written here, so an extras group
    # added or retired there needs no edit in this file to be covered.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@e9d6f990972a57673cdb72ec29e19d42ba28880f # v6.0.0
        with:
          python-version: "3.12"
      - name: Resolve every cueq extra
        run: |
          python -m pip install -U pip
          extras=$(python -c 'import configparser; c = configparser.ConfigParser(); c.read("setup.cfg", encoding="utf-8"); print(" ".join(n for n in c["options.extras_require"] if n.startswith("cueq")))')
          echo "resolving: $extras"
          # A derived list can come back empty -- a renamed section, a changed
          # prefix, a parse that failed -- and an empty `for` runs no pip at all,
          # so the job would exit green having measured nothing.
          if [ -z "$extras" ]; then
            echo "no cueq extra found in setup.cfg: the derivation above is broken" >&2
            exit 1
          fi
          status=0
          echo '## cueq wheel extras' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for extra in $extras; do
            if report=$(python -m pip install --dry-run --quiet ".[$extra]" 2>&1); then
              verdict=ok
            else
              verdict='DOES NOT RESOLVE'
              status=1
            fi
            printf '%-16s %s\n' "$extra" "$verdict" >> "$GITHUB_STEP_SUMMARY"
            printf -- '--- %s: %s\n%s\n' "$extra" "$verdict" "$report"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  unit:
    # The only 5-version matrix: python-version bugs are import/API-shaped and
    # this suite is cheap. No pytest-split: if tests/unit needs sharding, the
    # tests are misclassified.
    needs: [ legacy-lint, packages-lint ]
    runs-on: ubuntu-latest
    name: unit (py${{ matrix.python-version }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: ${{ matrix.python-version }}
          extras: dev
      - uses: ./.github/actions/run-tests
        with:
          # tests/golden rides along here rather than in a nightly: the
          # committed anchors and their references are the numerical contract
          # the rewrite is measured against, so a change that moves them has
          # to fail the pull request that made it, not a run nobody reads the
          # next morning. They are CPU-only, network-free, carry no capability
          # marker and no `slow` mark, so they collect on all four versions.
          #
          # tests/architecture is NOT here: it moved to the `architecture` job
          # below, which is the only one that installs both trees editable and
          # can therefore run the import contracts alongside it.
          tests: tests/unit tests/golden
          markers: not slow
          numprocs: auto

  architecture:
    # The guard that keeps the frozen legacy package unreachable from the v1
    # stack: the static import contracts, and the meta-lint that catches a
    # legacy symbol named in a v1 file with or without an import.
    #
    # It needs BOTH trees installed editable, which is what separates it from
    # every other job: import-linter resolves each root package on the
    # filesystem, so a missing one is reported as a broken contract rather than
    # as a missing install, and the gate would fail for the wrong reason.
    #
    # Fast and CPU-only, so it gates every pull request. It does not depend on
    # `lint`: a formatting failure and an import-direction failure are
    # different answers and waiting for one to hear the other helps nobody.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # hatch-vcs derives each package version from git describe.
          fetch-depth: 0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.12"
          extras: dev
      - name: Install the v1 packages
        run: |
          python -m pip install -e packages/mace-core \
                                -e packages/mace-torch \
                                -e packages/mace-jax
      - name: Check the import contracts
        run: lint-imports --config .importlinter
      - name: Check toolchain ownership
        # One owner per file, computed from the hook patterns themselves rather
        # than from a table that can drift away from them.
        run: python tests/architecture/check_toolchain_ownership.py
      - name: Check the debt book
        # Every coexistence compromise has a row, every row a burn-step ticket
        # and a fitness test that exists, and every row an open_debt marker.
        # The suite below asserts the same things; this step is what a
        # developer runs, and it prints the ledger.
        run: python tests/architecture/check_debt_book.py
      - name: Check the capabilities manifest
        # Its probe set against CAPABILITY_PROBES itself, and the generated
        # regions of the workflow files against the manifest. A hand edit to a
        # paths filter or a coverage floor fails here.
        run: python tests/architecture/check_capabilities_manifest.py
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/architecture
          numprocs: "0"

  packages:
    # The v1 stack under packages/. It installs no legacy package and no
    # torch, and that is the point rather than a saving: mace_core, mace_torch
    # and mace_jax have to stand up on their own, and a job that installed the
    # legacy environment first would keep passing on the day one of them grows
    # a dependency on it.
    #
    # Same four versions as the unit job, for the same reason: what breaks
    # across python versions here is import- and packaging-shaped, and the job
    # takes seconds.
    needs: [ legacy-lint, packages-lint ]
    runs-on: ubuntu-latest
    name: packages (py${{ matrix.python-version }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # hatch-vcs reads each version off `git describe`. The default
          # shallow clone carries no tags, so every package would build as its
          # fallback version and the metadata this job checks would be a
          # constant.
          fetch-depth: 0
      - uses: actions/setup-python@e9d6f990972a57673cdb72ec29e19d42ba28880f # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the v1 packages
        # One pip invocation, not four: mace-torch-v1 and mace-jax require
        # mace-core, which is not published, so pip only resolves it when it
        # sees the local path in the same run.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/mace-core \
                                -e packages/mace-torch \
                                -e packages/mace-jax \
                                -e packages/mace-launcher
          python -m pip install pytest
      - name: Run the package suites
        run: python -m pytest packages/*/tests -v

  workflows:
    # End-to-end CLI trainings via subprocess — the expensive suite. PRs run
    # the python-version frontier (min+max); pushes run the full matrix, and
    # nightly.yaml repeats it with network tests enabled.
    needs: [ legacy-lint, packages-lint ]
    runs-on: ubuntu-latest
    name: workflows (py${{ matrix.python-version }}, group ${{ matrix.split-group }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.10","3.13"]') || fromJSON('["3.10","3.11","3.12","3.13"]') }}
        split-group: [ 1, 2 ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: ${{ matrix.python-version }}
          # The wandb extra: test_wandb_logging.py is the only place the
          # --wandb flags run, and it is `wandb`-marked, so without the client
          # installed here the whole file skips and the flags go back to being
          # covered by nothing.
          extras: dev, wandb

      # Training tests can leave large files around until the run ends.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift \
            /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/chromium /opt/microsoft /opt/google
          df -h

      - uses: ./.github/actions/run-tests
        with:
          tests: tests/workflows
          # A lost wandb install must fail this job, not quietly stop testing
          # the flags. The zero-collection guard runs before pytest-split
          # deselects, so it sees the whole directory in either group.
          require-caps: wandb
          splits: "2"
          group: ${{ matrix.split-group }}

  coverage:
    # Informative (no threshold gate yet): summary + artifact. Nightly runs
    # the network-inclusive variant.
    needs: [ legacy-lint, packages-lint ]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-mace
        with:
          python-version: "3.12"
          # As in the workflows job above: without the extra the wandb tests
          # skip, and setup_wandb reads as uncovered.
          extras: dev, wandb
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift \
            /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/chromium /opt/microsoft /opt/google
      - uses: ./.github/actions/run-tests
        with:
          tests: tests/unit tests/workflows
          require-caps: wandb
          coverage: "true"
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage (tests/unit + tests/workflows, no network)'
            echo '```'
            coverage report --skip-covered --sort=cover | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Per-file coverage floors
        # The floors themselves are enforced in nightly.yaml, against the full
        # CPU scope they were calibrated on. Here they are only rendered
        # beside what this narrower selection measures, so that a pull request
        # can see the gate it will be judged by tomorrow without being failed
        # by a number measured somewhere else.
        if: always()
        run: |
          # >>> generated from capabilities.toml: coverage-floors-informative
          # Generated by tests/architecture/generate_ci.py from tests/architecture/capabilities.toml.
          # Informative only: this job measures tests/unit + tests/workflows, a
          # narrower denominator than the nightly gate the floors are calibrated
          # against, so it reports the two numbers and gates on neither.
          echo "## Per-file coverage floors (informative: narrower selection than the nightly gate)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          while read -r file floor; do
            case "$file" in ''|'#'*) continue ;; esac
            measured=$(coverage report --include="$file" 2>/dev/null | tail -1 | awk '{print $NF}')
            printf '%-34s floor %3s%%   measured %s\n' "$file" "$floor" "${measured:-n/a}" \
              >> "$GITHUB_STEP_SUMMARY"
          done <<'FLOORS'
          mace/modules/loss.py 90  # energy
          mace/modules/radial.py 90  # energy
          mace/modules/utils.py 85  # energy
          mace/data/utils.py 85  # data
          mace/data/neighborhood.py 95  # data
          mace/data/atomic_data.py 85  # data
          # energy
          mace/modules/loss.py 90
          mace/modules/radial.py 90
          mace/modules/utils.py 85
          # data
          mace/data/utils.py 85
          mace/data/neighborhood.py 95
          mace/data/atomic_data.py 85
          FLOORS
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # <<< generated from capabilities.toml: coverage-floors-informative
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
